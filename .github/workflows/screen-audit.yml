name: Screen audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Cache the NDK
        uses: actions/cache@v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/29.0.14206865
          key: ndk-29.0.14206865

      - uses: android-actions/setup-android@v3.2.2
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;29.0.14206865

      - uses: gradle/actions/setup-gradle@v4.4.4

      - name: Build the synthetic account
        run: ./gradlew :core:syntheticFixtures

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the audit on an emulator
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: E7_FIXTURES=${{ github.workspace }}/core/build/fixtures/synthetic tools/audit.sh

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: audit
          path: app/build/audit/
          if-no-files-found: warn
