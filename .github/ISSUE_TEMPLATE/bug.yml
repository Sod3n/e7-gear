name: Bug report
description: Something in E7 Gear does not work or looks wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: For example 1.0.3.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Do not paste your account id, session or gear file.
